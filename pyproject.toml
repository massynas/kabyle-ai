[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kabyle-ai"
version = "0.1.0"
description = "Tools and experiments for an everyday Kabyle language model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
data = ["datasets>=2.19,<4", "huggingface_hub>=0.23", "pandas>=2.2,<3"]
train = ["torch>=2.2", "transformers>=4.42,<5", "accelerate>=0.31", "peft>=0.11", "trl>=0.9", "bitsandbytes>=0.43; platform_system == 'Linux'"]
dev = ["pytest>=8,<9", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
